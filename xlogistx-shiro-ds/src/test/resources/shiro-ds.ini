# Sample shiro.ini for xlogistx-shiro-ds.
#
# The realm has a no-arg constructor, so the INI can build it. The data store is NOT in the INI:
# before the first login, register it under ResourceManager.Resource.DATA_STORE ("DataStore"), or
# call ShiroDSDomainSecurityManager.attach(realm, dataStore) / fromGlobal(dataStore).
#
#   ResourceManager.SINGLETON.register(ResourceManager.Resource.DATA_STORE, dataStore);
#   SecurityUtils.setSecurityManager(ShiroUtil.loadSecurityManager("shiro-ds.ini"));
#   ShiroDSDomainSecurityManager dsm = ShiroDSDomainSecurityManager.fromGlobal();
#
[main]
# authorization info is cached per subject GUID; without a cacheManager the realm re-flattens
# grants on every isPermitted / hasRole call
cacheManager = org.apache.shiro.cache.MemoryConstrainedCacheManager
securityManager.cacheManager = $cacheManager

# optional: JWT policy knobs (defaults: clockSkewMillis 60000, JWTTimestampWindowMillis 300000)
matcher = io.xlogistx.shiro.authc.CredentialsInfoMatcher
matcher.clockSkewMillis = 60000

dsRealm = io.xlogistx.shiro.ds.DSAuthorizingRealm
dsRealm.name = shiro-ds
dsRealm.credentialsMatcher = $matcher
# ResourceManager key of the APIDataStore; "DataStore" is the default
dsRealm.dataStoreResource = DataStore
# load roles/permissions into the cache at login instead of on the first isPermitted/hasRole
# (default false = Shiro's lazy behaviour)
dsRealm.eagerAuthorization = false

# other realms (XlogistXIniRealm, ShiroProxyRealm, ...) can sit beside it:
# securityManager.realms = $dsRealm, $iniRealm
securityManager.realm = $dsRealm

sessionManager = org.apache.shiro.session.mgt.DefaultSessionManager
sessionManager.globalSessionTimeout = 1800000
securityManager.sessionManager = $sessionManager
